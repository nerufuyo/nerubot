[package]
name = "nerubot"
version = "5.0.1"
edition = "2024"
authors = ["Nerufuyo"]
license = "MIT"

[dependencies]
# Discord
serenity = { version = "0.12", features = ["framework", "standard_framework", "gateway", "cache", "utils", "collector"] }

# Web API (Admin Panel)
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "json", "migrate"] }

# Cache
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Random
rand = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy = "0.15"

# Error handling
thiserror = "2"
anyhow = "1"

# LRU cache
lru = "0.12"

# Dashmap
dashmap = "6"
