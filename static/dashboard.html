<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeruBot — Reminder Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e4e6f0;--muted:#8890a4;--accent:#6366f1;--accent-h:#818cf8;--red:#ef4444;--red-h:#f87171;--green:#22c55e;--green-h:#4ade80;--amber:#f59e0b;--radius:12px}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
header h1 span{color:var(--accent)}
nav{display:flex;gap:8px}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-h)}
.btn-secondary{background:var(--border);color:var(--text)}.btn-secondary:hover{background:#3a3d50}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:var(--red-h)}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:var(--green-h)}
.btn-sm{padding:4px 10px;font-size:12px}
.container{max-width:1200px;margin:0 auto;padding:24px}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:32px}
.type-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:20px 16px;text-align:center;cursor:pointer;transition:all .15s}
.type-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.type-card.active{border-color:var(--accent);background:#1e1b3c}
.type-card .icon{font-size:28px;margin-bottom:6px}
.type-card .label{font-size:13px;color:var(--muted);font-weight:500}
.type-card .count{font-size:24px;font-weight:700;margin-top:4px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar select,.toolbar input{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px}
.toolbar select:focus,.toolbar input:focus{outline:none;border-color:var(--accent)}
.toolbar .spacer{flex:1}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden}
th,td{padding:12px 16px;text-align:left;font-size:14px}
th{background:#13151e;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
tr:not(:last-child) td{border-bottom:1px solid var(--border)}
tr:hover td{background:#1e2130}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-active{background:rgba(34,197,94,.15);color:var(--green)}
.badge-inactive{background:rgba(239,68,68,.15);color:var(--red)}
.badge-recurring{background:rgba(99,102,241,.15);color:var(--accent)}
.type-badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.type-holiday{background:rgba(239,68,68,.15);color:#f87171}
.type-work{background:rgba(34,197,94,.15);color:#4ade80}
.type-standup{background:rgba(99,102,241,.15);color:#818cf8}
.type-break{background:rgba(245,158,11,.15);color:#fbbf24}
.type-support{background:rgba(59,130,246,.15);color:#60a5fa}
.type-announcement{background:rgba(236,72,153,.15);color:#f472b6}
.type-custom{background:rgba(136,144,164,.15);color:#a0a8b4}
.actions{display:flex;gap:4px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .icon{font-size:48px;margin-bottom:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);width:520px;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h2{font-size:18px;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
.form-group textarea{resize:vertical;min-height:80px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;z-index:200;animation:slideUp .3s ease}
.toast-success{background:var(--green);color:#fff}
.toast-error{background:var(--red);color:#fff}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){.container{padding:16px}.type-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.form-row{grid-template-columns:1fr}.toolbar{flex-direction:column}.modal{width:calc(100vw - 32px);margin:16px}}
</style>
</head>
<body>
<header>
  <h1><span>NeruBot</span> Reminder Dashboard</h1>
  <nav>
    <button class="btn btn-primary" onclick="openCreate()">+ New Reminder</button>
  </nav>
</header>

<div class="container">
  <!-- Type Cards -->
  <div class="type-grid" id="typeGrid"></div>

  <!-- Toolbar -->
  <div class="toolbar">
    <select id="guildFilter" onchange="loadReminders()">
      <option value="">All Guilds</option>
    </select>
    <select id="statusFilter" onchange="loadReminders()">
      <option value="">All Status</option>
      <option value="true">Active</option>
      <option value="false">Inactive</option>
    </select>
    <span class="spacer"></span>
    <button class="btn btn-secondary btn-sm" onclick="loadReminders()">Refresh</button>
  </div>

  <!-- Table -->
  <table id="reminderTable">
    <thead>
      <tr>
        <th>Title</th>
        <th>Content</th>
        <th>Schedule</th>
        <th>Recurring</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="reminderBody"></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none">
    <div class="icon">📋</div>
    <p>No reminders found</p>
    <button class="btn btn-primary" onclick="openCreate()" style="margin-top:12px">Create First Reminder</button>
  </div>
</div>

<!-- Modal overlay (hidden by default) -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="maybeCloseModal(event)">
  <div class="modal" id="modalContent" onclick="event.stopPropagation()"></div>
</div>

<div id="toastContainer"></div>

<script>
const API = '/api/admin';
let currentType = '';
let guilds = [];

const TYPE_ICONS = {
  holiday: '🎉', work: '💼', standup: '🧍',
  break: '☕', support: '🛟', announcement: '📢', custom: '⚙️'
};
const TYPE_COLORS = {
  holiday: 'type-holiday', work: 'type-work', standup: 'type-standup',
  break: 'type-break', support: 'type-support', announcement: 'type-announcement', custom: 'type-custom'
};

async function api(url, opts = {}) {
  const res = await fetch(`${API}${url}`, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts
  });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  if (res.status === 204) return null;
  return res.json();
}

async function loadGuilds() {
  try {
    const data = await api('/guilds');
    guilds = data;
    const sel = document.getElementById('guildFilter');
    guilds.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g.guild_id;
      opt.textContent = `Guild ${g.guild_id}`;
      sel.appendChild(opt);
    });
  } catch(e) { console.error('loadGuilds:', e); }
}

async function loadTypes() {
  try {
    const types = await api('/reminders/types');
    const grid = document.getElementById('typeGrid');
    grid.innerHTML = types.map(t => `\
      <div class="type-card${currentType === t.value ? ' active' : ''}" onclick="filterType('${t.value}')">
        <div class="icon">${t.icon}</div>
        <div class="label">${t.label}</div>
        <div class="count">${t.count}</div>
      </div>
    `).join('');
  } catch(e) { console.error('loadTypes:', e); }
}

function filterType(type) {
  currentType = currentType === type ? '' : type;
  loadTypes();
  loadReminders();
}

async function loadReminders() {
  const params = new URLSearchParams();
  const gid = document.getElementById('guildFilter').value;
  const status = document.getElementById('statusFilter').value;
  if (gid) params.set('guild_id', gid);
  if (currentType) params.set('reminder_type', currentType);
  if (status) params.set('active', status);
  params.set('limit', '200');

  try {
    const reminders = await api(`/reminders?${params}`);
    const tbody = document.getElementById('reminderBody');
    const empty = document.getElementById('emptyState');

    if (!reminders.length) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }

    empty.style.display = 'none';
    tbody.innerHTML = reminders.map(r => {
      const dt = new Date(r.remind_at);
      const dateStr = dt.toLocaleDateString('id-ID', {year:'numeric',month:'short',day:'numeric'});
      const timeStr = dt.toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'});
      return `\
        <tr class="${r.active ? '' : 'inactive-row'}" style="${r.active ? '' : 'opacity:.5'}">
          <td>
            <span class="type-badge ${TYPE_COLORS[r.reminder_type] || 'type-custom'}">${r.reminder_type}</span>
            <strong style="margin-left:6px">${esc(r.title || '-')}</strong>
          </td>
          <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.content)}</td>
          <td><span title="${r.remind_at}">${dateStr} ${timeStr}</span></td>
          <td>${r.recurring ? `<span class="badge badge-recurring">${r.recurring}</span>` : '-'}</td>
          <td><span class="badge ${r.active ? 'badge-active' : 'badge-inactive'}">${r.active ? 'Active' : 'Inactive'}</span></td>
          <td class="actions">
            <button class="btn btn-secondary btn-sm" onclick="openEdit(${r.id})">Edit</button>
            <button class="btn btn-secondary btn-sm" onclick="toggleReminder(${r.id})">${r.active ? 'Disable' : 'Enable'}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteReminder(${r.id})">Del</button>
          </td>
        </tr>
      `;
    }).join('');
  } catch(e) { console.error('loadReminders:', e); }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function toggleReminder(id) {
  try {
    await api(`/reminders/${id}/toggle`, { method: 'PUT' });
    toast('Reminder toggled', 'success');
    loadReminders();
    loadTypes();
  } catch(e) { toast('Failed to toggle', 'error'); }
}

async function deleteReminder(id) {
  if (!confirm('Delete this reminder?')) return;
  try {
    await api(`/reminders/${id}`, { method: 'DELETE' });
    toast('Reminder deleted', 'success');
    loadReminders();
    loadTypes();
  } catch(e) { toast('Failed to delete', 'error'); }
}

// ── Modal ──────────────────────────────────────────────
function openCreate() {
  document.getElementById('modalContent').innerHTML = reminderForm();
  document.getElementById('modalOverlay').style.display = 'flex';
}

async function openEdit(id) {
  try {
    const reminders = await api(`/reminders?limit=500`);
    const r = reminders.find(x => x.id === id);
    if (!r) return;
    document.getElementById('modalContent').innerHTML = reminderForm(r);
    document.getElementById('modalOverlay').style.display = 'flex';
  } catch(e) { toast('Failed to load', 'error'); }
}

function maybeCloseModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

function reminderForm(existing) {
  const isEdit = !!existing;
  const id = existing ? existing.id : '';
  const title = existing ? existing.title : '';
  const content = existing ? existing.content : '';
  const type = existing ? existing.reminder_type : 'custom';
  const guildId = existing ? existing.guild_id : (document.getElementById('guildFilter').value || '');
  const channelId = existing ? existing.channel_id : '';
  const recurring = existing ? (existing.recurring || '') : '';

  let remindAt = '';
  if (existing) {
    const d = new Date(existing.remind_at);
    const pad = n => String(n).padStart(2, '0');
    remindAt = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  return `\
    <h2>${isEdit ? 'Edit Reminder' : 'New Reminder'}</h2>
    <form onsubmit="submitReminder(event, ${isEdit ? id : 'null'})">
      <div class="form-row">
        <div class="form-group">
          <label>Reminder Type</label>
          <select name="reminder_type">
            <option value="holiday" ${type === 'holiday' ? 'selected' : ''}>Holiday</option>
            <option value="work" ${type === 'work' ? 'selected' : ''}>Work</option>
            <option value="standup" ${type === 'standup' ? 'selected' : ''}>Standup</option>
            <option value="break" ${type === 'break' ? 'selected' : ''}>Break</option>
            <option value="support" ${type === 'support' ? 'selected' : ''}>Support</option>
            <option value="announcement" ${type === 'announcement' ? 'selected' : ''}>Announcement</option>
            <option value="custom" ${type === 'custom' ? 'selected' : ''}>Custom</option>
          </select>
        </div>
        <div class="form-group">
          <label>Recurring</label>
          <select name="recurring">
            <option value="">None (one-time)</option>
            <option value="daily" ${recurring === 'daily' ? 'selected' : ''}>Daily</option>
            <option value="weekly" ${recurring === 'weekly' ? 'selected' : ''}>Weekly</option>
            <option value="monthly" ${recurring === 'monthly' ? 'selected' : ''}>Monthly</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" value="${esc(title)}" placeholder="e.g., Morning Standup" required>
      </div>
      <div class="form-group">
        <label>Content (message text)</label>
        <textarea name="content" placeholder="Reminder message..." required>${esc(content)}</textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Schedule (Date & Time)</label>
          <input type="datetime-local" name="remind_at" value="${remindAt}" required>
        </div>
        <div class="form-group">
          <label>Guild ID</label>
          <select name="guild_id" required>
            <option value="">Select Guild</option>
            ${guilds.map(g => `<option value="${g.guild_id}" ${String(g.guild_id) === String(guildId) ? 'selected' : ''}>Guild ${g.guild_id}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Channel ID</label>
          <input type="number" name="channel_id" value="${channelId}" placeholder="Discord channel ID" required>
        </div>
        <div class="form-group">
          <label>User ID (bot sender)</label>
          <input type="number" name="user_id" value="${existing ? existing.user_id : ''}" placeholder="Bot user ID" required>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">${isEdit ? 'Update' : 'Create'}</button>
      </div>
    </form>
  `;
}

async function submitReminder(e, existingId) {
  e.preventDefault();
  const form = e.target;
  const data = {
    guild_id: parseInt(form.guild_id.value),
    user_id: parseInt(form.user_id.value),
    channel_id: parseInt(form.channel_id.value),
    content: form.content.value,
    remind_at: new Date(form.remind_at.value).toISOString(),
    recurring: form.recurring.value || null,
    reminder_type: form.reminder_type.value,
    title: form.title.value
  };

  try {
    if (existingId) {
      await api(`/reminders/${existingId}`, { method: 'PUT', body: JSON.stringify(data) });
      toast('Reminder updated', 'success');
    } else {
      await api('/reminders', { method: 'POST', body: JSON.stringify(data) });
      toast('Reminder created', 'success');
    }
    closeModal();
    loadReminders();
    loadTypes();
  } catch(e) {
    toast(`Failed: ${e.message}`, 'error');
  }
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// Init
loadGuilds().then(() => {
  loadTypes();
  loadReminders();
});
</script>
</body>
</html>
